[project]
name = "au-fil-d-une-vie"
version = "0.1.0"
description = "Partir en quête de son histoire familiale en interviewant ses proches. Tout reste sur l'ordinateur."
readme = "README.md"
authors = [{ name = "Emery" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "platformdirs>=4.2",
    "networkx>=3.3",
    "reportlab>=4.2",
    "faster-whisper>=1.0",
    "spacy>=3.7",
    "pyside6-essentials>=6.12.0",
    "pyside6-addons>=6.12.0",
]

[project.scripts]
au-fil-d-une-vie = "au_fil_d_une_vie.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-qt>=4.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/au_fil_d_une_vie"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["au_fil_d_une_vie"]

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "spacy.*", "networkx.*", "reportlab.*"]
ignore_missing_imports = true
